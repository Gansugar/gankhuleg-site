<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мөнгөнцогийн Ганхүлэг</title>
<meta name="description" content="Монгол Улсын Их Хурлын гишүүн Мөнгөнцогийн Ганхүлэгийн албан ёсны вэбсайт.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#C8102E;        /* main accent – change to your party/brand colour */
  --brand-dark:#9E0B23;
  --blue:#0B3D91;
  --ink:#1d1d1f;
  --muted:#5f6368;
  --bg:#ffffff;
  --soft:#f4f5f7;
  --line:#e3e5e8;
  --radius:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}

/* Top bar */
.topbar{padding:0}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;font-weight:700;
  padding:10px 16px;border-radius:0 0 var(--radius) var(--radius);font-size:14px;letter-spacing:.3px}
.badge svg{width:18px;height:18px}
.site-name{color:var(--brand);font-size:28px;font-weight:700;margin:24px 0 16px}

/* Nav */
nav.main{background:var(--soft);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;padding:0 12px}
nav.main ul{list-style:none;display:flex;flex-wrap:wrap}
nav.main a{display:block;padding:14px 14px;text-decoration:none;font-size:14px;font-weight:500}
nav.main a.active,nav.main a:hover{box-shadow:inset 0 -3px 0 var(--brand)}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:var(--radius);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}

/* Hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:32px 0;align-items:stretch}
.hero-card{background:var(--brand);color:#fff;padding:40px 36px;position:relative;overflow:hidden}
.hero-card h1{font-size:30px;line-height:1.25;margin-bottom:20px}
.hero-card p{margin-bottom:14px;font-size:15px}
.hero-card::after{content:"";position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;border-radius:50%;
  border:28px solid rgba(255,255,255,.08)}
.hero-photo{background:var(--soft) center/cover no-repeat;min-height:420px;position:relative}
.hero-photo img{width:100%;height:100%;object-fit:cover}

/* Placeholder look for missing photos */
.ph{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;
  background:repeating-linear-gradient(45deg,#eef0f3 0 12px,#f6f7f9 12px 24px);width:100%;height:100%;min-height:inherit;padding:24px}

/* CTA cards */
.ctas{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:0 0 48px}
.cta{border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:14px}
.cta h3{font-size:18px}
.btn{display:inline-block;align-self:flex-start;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;
  padding:10px 22px;border-radius:var(--radius);font-size:14px}
.btn:hover{background:var(--brand-dark)}
.btn.alt{background:var(--blue)}
.social{display:flex;gap:10px}
.social a{width:40px;height:40px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.social a:hover{background:var(--brand);color:#fff}
.social svg{width:18px;height:18px;fill:currentColor}

/* Sections */
section.block{padding:56px 0;border-top:1px solid var(--line)}
section.block h2{font-size:26px;color:var(--brand);margin-bottom:24px}
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;align-items:start}
.about .photo{min-height:380px;border-radius:var(--radius);overflow:hidden}
.about p{margin-bottom:14px}
.facts{list-style:none;display:grid;gap:10px;margin-top:20px}
.facts li{background:var(--soft);padding:12px 16px;border-left:4px solid var(--brand);border-radius:var(--radius);font-size:14px}

.news{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.post{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.post .thumb{height:320px}
.post .thumb img{object-position:center 25%}
.hero-photo img{object-position:center 20%}
.post .body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.post time{font-size:12px;color:var(--muted)}
.post h3{font-size:16px;line-height:1.35}
.post p{font-size:14px;color:var(--muted)}
.post a.more{margin-top:auto;font-size:14px;font-weight:600;color:var(--brand);text-decoration:none}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.contact dl{display:grid;gap:14px}
.contact dt{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.contact dd{font-weight:500}
form{display:grid;gap:12px}
label{font-size:13px;font-weight:500}
input,textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius)}
textarea{min-height:120px;resize:vertical}

footer{background:var(--ink);color:#c9cbcf;padding:32px 0;font-size:13px;margin-top:24px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

@media (max-width:860px){
  .hero,.about,.contact{grid-template-columns:1fr}
  .hero-photo{min-height:340px}
  .ctas,.news{grid-template-columns:1fr}
  nav.main{flex-direction:column;align-items:stretch;padding:8px}
  nav.main ul{justify-content:center}
  .lang{justify-content:center;padding:6px 0}
  .hero-card{padding:28px 22px}
  .hero-card h1{font-size:24px}
}
</style>
</head>
<body>

<header class="wrap topbar">
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.7L18.2 21 12 17.3 5.8 21l1.7-7L2 9.3l7.1-.4z"/></svg>
    <span data-k="home.badge"></span>
  </div>
  <div class="site-name" data-k="home.name"></div>
  <nav class="main" aria-label="Цэс">
    <ul>
      <li><a href="#top" class="active">Нүүр</a></li>
      <li><a href="#about">Миний тухай</a></li>
      <li><a href="#news">Мэдээ</a></li>
      <li><a href="#contact">Холбоо барих</a></li>
    </ul>
  </nav>
</header>

<!-- All text and photos come from the content/*.json files, which admins edit at /admin -->
<main class="wrap" id="top">

  <div class="hero">
    <div class="hero-card">
      <h1 data-k="home.heading"></h1>
      <div id="letter"></div>
    </div>
    <div class="hero-photo"><img id="portrait" alt=""></div>
  </div>

  <div class="ctas">
    <div class="cta">
      <h3>Холбогдох шаардлагатай юу?</h3>
      <a class="btn" href="#contact">Холбоо барих</a>
    </div>
    <div class="cta">
      <h3>Сүүлийн үеийн мэдээ</h3>
      <a class="btn alt" href="#news">Унших</a>
    </div>
    <div class="cta">
      <h3>Сошиал хуудсаар дагах</h3>
      <div class="social">
        <a id="fb" target="_blank" rel="noopener" aria-label="Facebook">
          <svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v9h4v-9H17l.5-4h-4V8.8c0-.5.3-.8.5-.8z"/></svg>
        </a>
        <a id="wa" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <section class="block" id="about">
    <h2>Миний тухай</h2>
    <div class="about">
      <div class="photo"><img id="aboutPhoto" alt="" style="width:100%;height:100%;object-fit:cover"></div>
      <div>
        <div id="bio"></div>
        <ul class="facts" id="facts"></ul>
      </div>
    </div>
  </section>

  <section class="block" id="news">
    <h2>Мэдээ</h2>
    <div class="news" id="newsList"></div>
  </section>

  <section class="block" id="contact">
    <h2>Холбоо барих</h2>
    <div class="contact">
      <dl>
        <div><dt>И-мэйл</dt><dd><a id="email"></a></dd></div>
        <div><dt>Утас / WhatsApp</dt><dd><a id="phone"></a></dd></div>
        <div><dt>Хаяг</dt><dd data-k="contact.address"></dd></div>
        <div><dt>Тойрог</dt><dd data-k="contact.area"></dd></div>
      </dl>
      <form id="msg">
        <div><label for="n">Нэр</label><input id="n" required></div>
        <div><label for="s">Сэдэв</label><input id="s" required></div>
        <div><label for="m">Зурвас</label><textarea id="m" required></textarea></div>
        <button class="btn" type="submit" style="border:0;cursor:pointer">Илгээх</button>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> <span data-k="home.name"></span></span>
    <span data-k="home.badge"></span>
  </div>
</footer>

<script>
(async function(){
  function paras(text){
    return String(text||'').split(/\n\s*\n/).filter(Boolean).map(function(p){
      var el=document.createElement('p'); el.innerText=p.trim(); return el;
    });
  }
  function get(name){ return fetch('content/'+name+'.json',{cache:'no-cache'}).then(function(r){return r.json();}); }
  var names=['home','about','news','contact'], d={};
  var res=await Promise.all(names.map(get));
  names.forEach(function(n,i){ d[n]=res[i]; });

  document.querySelectorAll('[data-k]').forEach(function(el){
    var k=el.dataset.k.split('.'); el.textContent=(d[k[0]]||{})[k[1]]||'';
  });
  document.title=d.home.name;
  document.getElementById('year').textContent=new Date().getFullYear();

  var letter=document.getElementById('letter');
  paras(d.home.letter).concat(paras(d.home.signoff)).forEach(function(p){ letter.appendChild(p); });
  var portrait=document.getElementById('portrait'); portrait.src=d.home.portrait; portrait.alt=d.home.name;

  var aboutPhoto=document.getElementById('aboutPhoto'); aboutPhoto.src=d.about.photo; aboutPhoto.alt=d.home.name;
  var bio=document.getElementById('bio'); paras(d.about.bio).forEach(function(p){ bio.appendChild(p); });
  var facts=document.getElementById('facts');
  (d.about.facts||[]).forEach(function(f){ var li=document.createElement('li'); li.textContent=f.text; facts.appendChild(li); });

  var list=document.getElementById('newsList');
  (d.news.posts||[]).forEach(function(p){
    var a=document.createElement('article'); a.className='post';
    if(p.image){
      var thumb=document.createElement('div'); thumb.className='thumb';
      var img=document.createElement('img'); img.src=p.image; img.alt=p.title||''; img.style.cssText='width:100%;height:100%;object-fit:cover';
      thumb.appendChild(img); a.appendChild(thumb);
    }
    var body=document.createElement('div'); body.className='body';
    if(p.date){ var t=document.createElement('time'); t.textContent=String(p.date).slice(0,10).replace(/-/g,'.'); body.appendChild(t); }
    var h=document.createElement('h3'); h.textContent=p.title||''; body.appendChild(h);
    paras(p.body).forEach(function(x){ body.appendChild(x); });
    if(p.link){ var m=document.createElement('a'); m.className='more'; m.href=p.link; m.target='_blank'; m.rel='noopener'; m.textContent='Дэлгэрэнгүй →'; body.appendChild(m); }
    a.appendChild(body); list.appendChild(a);
  });

  var c=d.contact;
  var email=document.getElementById('email'); email.textContent=c.email; email.href='mailto:'+c.email;
  var digits=String(c.phone||'').replace(/\D/g,'');
  var phone=document.getElementById('phone'); phone.textContent=c.phone; phone.href='tel:+'+digits;
  document.getElementById('wa').href='https://wa.me/'+digits;
  document.getElementById('fb').href=c.facebook;

  document.getElementById('msg').addEventListener('submit', function(e){
    e.preventDefault();
    var body=document.getElementById('m').value+'\n\n— '+document.getElementById('n').value;
    location.href='mailto:'+c.email+'?subject='+encodeURIComponent(document.getElementById('s').value)+'&body='+encodeURIComponent(body);
  });
})();
</script>
<!-- Netlify Identity: lets invited admins log in, then sends them to /admin -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
if(window.netlifyIdentity){netlifyIdentity.on('init',function(u){if(!u){netlifyIdentity.on('login',function(){location.href='/admin/';});}});}
</script>
</body>
</html>
